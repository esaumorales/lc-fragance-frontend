name: CI

# El despliegue del frontend lo hace Vercel solo; aca solo se verifica.
on:
  push:
    branches: [production, test, esau]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sin version: la toma de packageManager en package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint src --max-warnings=0
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
